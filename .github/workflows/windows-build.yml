name: Windows build

# Builds HyperGet.exe (PyInstaller), a portable zip and an installer (Inno Setup).
# Push a tag like v0.1.0 to also publish them as a GitHub Release.
# Runs only when it matters: a version tag (publishes a release), app code
# changing on main, or by hand (Actions > Windows build > Run workflow).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "hypeget/**"
      - "extension/**"
      - "packaging/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . yt-dlp pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(python -c 'import hypeget;print(hypeget.__version__)')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Store extension IDs for the browser helper
        shell: pwsh
        run: |
          # Lets the native messaging helper accept the store versions of the extension too.
          @{ chrome = "${{ vars.HYPERGET_CHROME_EXTENSION_ID }}"; edge = "${{ vars.HYPERGET_EDGE_EXTENSION_ID }}" } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM hypeget\store_ids.json

      - name: Build HyperGet.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name HyperGet
          --icon packaging/hypeget.ico
          --add-data "hypeget/ui;hypeget/ui"
          --add-data "hypeget/store_ids.json;hypeget"
          --collect-submodules yt_dlp
          --collect-all webview
          packaging/launcher.py

      - name: Build HyperGet-NativeHost.exe (browser helper)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --console --name HyperGet-NativeHost --icon packaging/hypeget.ico --distpath build\host packaging/native_host_launcher.py
          Copy-Item build\host\HyperGet-NativeHost.exe dist\HyperGet\

      - name: Bundle FFmpeg and the browser extension
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist\HyperGet\ffmpeg.exe
          python tools/build_extension.py
          $full = Get-ChildItem dist\extension\*-full.zip | Select-Object -First 1
          Expand-Archive $full.FullName dist\HyperGet\extension
          Copy-Item README.md dist\HyperGet\README.md

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $env:HYPEGET_HOME = "$env:RUNNER_TEMP\hg-home"
          $p = Start-Process dist\HyperGet\HyperGet.exe -ArgumentList "--headless","--port","52999" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try {
              $r = Invoke-RestMethod http://127.0.0.1:52999/api/state -Headers @{ "X-HyperGet" = "1" }
              $ui = Invoke-WebRequest http://127.0.0.1:52999/ -UseBasicParsing
              if ($ui.Content -match "HyperGet Downloader" -and $r.features.ffmpeg -and $r.features.sites) { $ok = $true }
            } catch {}
          }
          # The browser helper: talk to it exactly like Chrome does.
          $env:HG_HOST = (Resolve-Path dist\HyperGet\HyperGet-NativeHost.exe).Path
          @'
          import json, os, struct, subprocess
          p = subprocess.Popen([os.environ["HG_HOST"]], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          msg = json.dumps({"id": 1, "method": "GET", "path": "/api/ping"}).encode()
          p.stdin.write(struct.pack("<I", len(msg)) + msg); p.stdin.flush()
          n = struct.unpack("<I", p.stdout.read(4))[0]; reply = json.loads(p.stdout.read(n))
          p.stdin.close(); p.wait(timeout=20)
          print("native host reply:", reply)
          assert reply["ok"] and reply["data"]["app"] == "hyperget", reply
          '@ | python -
          if ($LASTEXITCODE -ne 0) { $ok = $false; Write-Host "native host check failed" }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "HyperGet.exe did not start correctly (UI, ffmpeg, yt-dlp or browser helper missing)" }
          Write-Host "HyperGet.exe started, served the UI, found ffmpeg and yt-dlp; the browser helper answered"
          # Registration writes the manifest + HKCU keys for each browser
          Start-Process dist\HyperGet\HyperGet.exe -ArgumentList "--register" -Wait
          Get-Item "HKCU:\Software\Google\Chrome\NativeMessagingHosts\tech.dolese.hyperget" | Out-Host

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\HyperGet -DestinationPath "dist\HyperGet-portable-${{ steps.ver.outputs.version }}.zip"

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = @("/DAppVersion=${{ steps.ver.outputs.version }}")
          # Store IDs come from repo variables (Settings > Secrets and variables > Actions > Variables)
          if ("${{ vars.HYPERGET_CHROME_EXTENSION_ID }}") { $iscc += "/DChromeExtId=${{ vars.HYPERGET_CHROME_EXTENSION_ID }}" }
          if ("${{ vars.HYPERGET_EDGE_EXTENSION_ID }}") { $iscc += "/DEdgeExtId=${{ vars.HYPERGET_EDGE_EXTENSION_ID }}" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @iscc packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: HyperGet-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/HyperGet-Setup-*.exe
            dist/HyperGet-portable-*.zip
            dist/extension/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HyperGet-Setup-*.exe
            dist/HyperGet-portable-*.zip
            dist/extension/*.zip
