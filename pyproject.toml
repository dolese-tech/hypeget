[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypeget"
version = "0.1.0"
description = "HyperGet Downloader - multi-connection download manager with HLS support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pywebview>=5.0",      # native window for the UI
  "cryptography>=41",    # AES-128 decryption for encrypted (non-DRM) HLS streams
  "pystray>=0.19",       # notification-area (tray) icon
  "Pillow>=10",          # tray icon image
]

[project.optional-dependencies]
# Optional site extractor (YouTube and ~1000 other sites) with quality selection.
sites = ["yt-dlp>=2024.1.1"]
dev = ["pytest>=8"]

[project.scripts]
hypeget = "hypeget.__main__:main"

[tool.setuptools.packages.find]
include = ["hypeget*"]

[tool.setuptools.package-data]
hypeget = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
