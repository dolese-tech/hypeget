<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; font: 13px "Inter", "Segoe UI", system-ui, sans-serif; color: #0f172a; background: #fff; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
  .logo { width: 22px; height: 22px; }
  header b { flex: 1; font-size: 13.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; display: inline-block; margin-right: 6px; }
  .on .dot { background: #16a34a; } .off .dot { background: #dc2626; }
  #status { font-size: 11.5px; color: #64748b; }
  section { padding: 10px 14px; }
  h4 { margin: 2px 0 8px; font-size: 11px; letter-spacing: .07em; color: #64748b; font-weight: 600; }
  .item { display: grid; grid-template-columns: 40px 1fr auto; gap: 9px; align-items: center; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
  .badge { height: 22px; border-radius: 5px; background: #e2e8f0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #334155; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .sub { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; cursor: pointer; }
  .dl { border: 0; background: #2563eb; color: #fff; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
  .dl:hover { background: #1d4ed8; }
  .wide { width: 100%; padding: 8px; margin-top: 2px; }
  .opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
  .opts button { border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; padding: 4px 9px; font-size: 12px; }
  .opts button:hover { border-color: #2563eb; color: #2563eb; }
  .empty, .msg { color: #64748b; font-size: 12px; padding: 4px 0 8px; line-height: 1.45; }
  .msg.err { color: #dc2626; }
  label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 4px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-top: 6px; }
  input[type=number] { width: 80px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 5px; font: inherit; }
  footer { border-top: 1px solid #e2e8f0; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon32.png" width="22" height="22" alt="">
    <b>HyperGet</b><span id="status"><span class="dot"></span>Checking…</span>
  </header>
  <section>
    <button class="dl wide" id="pageVideo">Download video on this page…</button>
    <div id="pageOpts"></div>
  </section>
  <section>
    <h4>DETECTED ON THIS TAB</h4>
    <div id="list"><div class="empty">Nothing yet. Play the video, then reopen this menu.</div></div>
  </section>
  <footer><section>
    <h4>SETTINGS</h4>
    <label><input type="checkbox" id="intercept"> Take over browser downloads</label>
    <div class="row">Only files larger than (MB) <input type="number" id="minMB" min="0"></div>
    <div class="row">HyperGet port <input type="number" id="port" min="1024" max="65535"></div>
  </section></footer>
<script src="popup.js"></script>
</body>
</html>
